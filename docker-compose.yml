services:

  # ── Ollama — local LLM server ──────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: parliament_ollama
    volumes:
      - ollama_models:/root/.ollama       # persists downloaded models
    ports:
      - "11434:11434"
    restart: unless-stopped
    # GPU support — uncomment if you have an NVIDIA GPU and nvidia-container-toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Model pull — runs once to download gemma2:2b ─────────────────────────
  ollama-pull:
    image: ollama/ollama:latest
    container_name: parliament_gemma2_pull
    depends_on:
      - ollama
    volumes:
      - ollama_models:/root/.ollama
    entrypoint: >
      sh -c "
        echo 'Waiting for Ollama to be ready...';
        until ollama list > /dev/null 2>&1; do sleep 2; done;
        echo 'Pulling gemma2:2b...';
        ollama pull gemma2:2b;
        echo 'Done.';
      "
    environment:
      - OLLAMA_HOST=ollama:11434
    restart: "no"

  # ── Pipeline — parse / embed / query ──────────────────────────────────────
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parliament_gemma2_pipeline
    depends_on:
      - ollama
    volumes:
      - ./data/pdfs:/app/data/pdfs          # drop PDFs here
      - ./data/chunks:/app/data/chunks      # parsed .jsonl files land here
      - ./data/chroma:/app/data/chroma      # ChromaDB persists here
    environment:
      - OLLAMA_HOST=http://ollama:11434      # point at the ollama service
      - LLAMA_MODEL=${LLAMA_MODEL:-gemma2:2b}
    stdin_open: true
    tty: true
    # Override CMD per task — see Makefile / usage below
    command: ["python", "src/parse.py", "--help"]

  # ── Ingest — one-shot parse + embed (run before starting the UI) ──────────
  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parliament_gemma2_ingest
    depends_on:
      - ollama
    volumes:
      - ./data/pdfs:/app/data/pdfs
      - ./data/chunks:/app/data/chunks
      - ./data/chroma:/app/data/chroma
    environment:
      - OLLAMA_HOST=http://ollama:11434
    # Parses all PDFs then embeds them into ChromaDB
    command: >
      sh -c "
        python src/parse.py --input-dir data/pdfs --output-dir data/chunks &&
        python src/embed.py --chunks-dir data/chunks --db-dir data/chroma
      "
    restart: "no"

  # ── UI — FastAPI + chat frontend ──────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    container_name: parliament_gemma2_ui
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    volumes:
      - ./data/pdfs:/app/data/pdfs
      - ./data/chunks:/app/data/chunks
      - ./data/chroma:/app/data/chroma
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - LLAMA_MODEL=${LLAMA_MODEL:-gemma2:2b}

volumes:
  ollama_models:
